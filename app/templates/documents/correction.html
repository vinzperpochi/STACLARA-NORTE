{% extends 'resident/_portal_base.html' %}{% block title %}Correct document request{% endblock %}{% block content %}<h1 class="text-headline-sm mb-3">Correct {{ item.request_number }}</h1><p class="mb-3">{{ item.additional_requirements_note }}</p><form method="post" class="civic-panel p-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for key,label in fields.items() %}<label class="block mb-3">{{ label }}<input class="civic-input" maxlength="250" name="detail_{{ key }}" value="{{ (item.additional_data or {}).get(key,'') }}"></label>{% endfor %}<label>Purpose<textarea required maxlength="500" class="civic-input" name="description">{{ item.description or '' }}</textarea></label><button class="civic-btn mt-3">Submit corrections for review</button></form>{% endblock %}
