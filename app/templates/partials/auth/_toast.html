{% from 'components/icons.html' import icon %}
<div class="fixed top-5 right-5 z-50 transform translate-y-[-150%] opacity-0 transition-all duration-300 pointer-events-none max-w-md w-full px-4" id="toast-notification" role="status" aria-live="polite">
  <div class="bg-white border-2 border-[#22B33A] text-[#11291A] px-4 py-3.5 rounded-lg shadow-xl flex items-start gap-3" data-toast-card>
    <div class="w-8 h-8 rounded-full bg-[#12902B] text-white flex items-center justify-center shrink-0 mt-0.5" id="toast-icon-wrapper">
      {{ icon('check-circle', 'text-lg') }}
    </div>
    <div class="flex-1 text-left">
      <h4 class="text-xs font-bold text-[#12902B] uppercase tracking-wider" id="toast-title">Notice</h4>
      <p class="text-xs text-[#5F7265] mt-0.5 leading-snug" id="toast-message"></p>
    </div>
    <button class="text-[#5F7265] hover:text-[#11291A] shrink-0 pointer-events-auto cursor-pointer p-1 bg-transparent border-0" data-dismiss-toast type="button" aria-label="Dismiss notification">
      {{ icon('x-lg', 'text-base') }}
    </button>
  </div>
</div>
<div class="hidden" id="flash-payload">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div data-flash-item data-flash-category="{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
