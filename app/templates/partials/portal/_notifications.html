{% from 'components/icons.html' import icon %}
<div class="workspace-notifications" data-notifications data-list-url="{{ url_for('workspace.notifications') }}" data-read-url="{{ url_for('workspace.notification_read') }}" data-csrf="{{ csrf_token() }}">
  <button class="notification-trigger" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notification-panel" data-notification-trigger>{{ icon('notifications', '', size='22px') }}<span class="notification-count" data-notification-count {% if not unread_notifications %}hidden{% endif %}>{{ unread_notifications }}</span></button>
  <section id="notification-panel" class="notification-panel" hidden aria-label="Notifications">
    <div class="notification-panel-heading"><strong>Notifications</strong><button type="button" data-notification-close aria-label="Close notifications">{{ icon('close', '', size='20px') }}</button></div>
    <button type="button" class="civic-btn-outline" data-notification-read-all>Mark all as read</button>
    <p role="status" data-notification-status>Loading notifications…</p><div data-notification-items></div>
  </section>
</div>
