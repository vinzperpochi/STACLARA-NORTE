{% extends "official/_official_base.html" %}
{% block active_nav %}official.business_list{% endblock %}{% block title %}{{ 'Edit' if business else 'Add' }} Business{% endblock %}{% block content %}<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><h1 class="text-headline-sm font-headline-sm text-on-surface">{{ 'Edit' if business else 'Add' }} business</h1><a class="civic-btn-outline" href="{{ url_for('official.business_list') }}">Back to records</a></div><form method="post" class="civic-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Business name</label><input required class="civic-input" name="business_name" value="{{ business.business_name if business else '' }}"></div><div class="col-md-6"><label class="form-label">Owner</label><select required class="civic-input" name="owner_id"><option value="">Select resident</option>{% for resident in residents %}<option value="{{ resident.id }}" {% if business and business.owner_id == resident.id %}selected{% endif %}>{{ resident.last_name }}, {{ resident.first_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Business address</label><input required class="civic-input" name="business_address" value="{{ business.business_address if business else '' }}"></div><div class="col-md-6"><label class="form-label">Type of business</label><input required class="civic-input" name="business_type" value="{{ business.business_type if business else '' }}"></div><div class="col-md-4"><label class="form-label">Registration date</label><input required type="date" class="civic-input" name="registration_date" value="{{ business.registration_date if business else '' }}"></div><div class="col-md-4"><label class="form-label">Permit/endorsement number</label><input required class="civic-input" name="permit_number" value="{{ business.permit_number if business else '' }}"></div><div class="col-md-4"><label class="form-label">Expiration date</label><input required type="date" class="civic-input" name="expiration_date" value="{{ business.expiration_date if business else '' }}"></div><div class="col-md-4"><label class="form-label">Status</label><select class="civic-input" name="status">{% for s in ['ACTIVE','PENDING','EXPIRED','SUSPENDED'] %}<option {% if business and business.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div></div><div class="mt-4"><button class="civic-btn">Save business record</button></div></form>{% endblock %}
