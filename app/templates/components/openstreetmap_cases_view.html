<!-- OpenStreetMap Cases Map View Component -->
<div class="google-maps-cases-container osm-cases-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Incident Locations Map</h5>
        <div class="map-controls">
            <button type="button" id="cluster-toggle" class="btn btn-sm btn-outline-primary">
                <i class="fas fa-layer-group"></i> Toggle Clustering
            </button>
            <button type="button" id="refresh-map" class="btn btn-sm btn-outline-success">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>
    
    <!-- Map container -->
    <div id="cases-map" class="cases-map"></div>
    
    <!-- Map legend -->
    <div class="map-legend mt-2">
        <div class="legend-title">Case Status:</div>
        <div class="legend-items">
            <div class="legend-item">
                <div class="marker-sample open"></div>
                <span>Open</span>
            </div>
            <div class="legend-item">
                <div class="marker-sample investigating"></div>
                <span>Investigating</span>
            </div>
            <div class="legend-item">
                <div class="marker-sample resolved"></div>
                <span>Resolved</span>
            </div>
            <div class="legend-item">
                <div class="marker-sample dismissed"></div>
                <span>Dismissed</span>
            </div>
        </div>
    </div>
</div>

<!-- Load Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
      crossorigin="">

<!-- Load Leaflet.markercluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" 
      crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" 
      crossorigin="">

<!-- Load Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin=""></script>

<!-- Load Leaflet.markercluster JS -->
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" 
        crossorigin=""></script>

<script>
let map;
let markers = [];
let markerClusterGroup = null;
let individualLayerGroup = null;
let clusteringEnabled = true;

function initOpenStreetMapCases() {
    const mapContainer = document.getElementById('cases-map');
    
    if (typeof L === 'undefined') {
        mapContainer.innerHTML = '<div class="alert alert-warning mb-0">Leaflet library failed to load. Please refresh the page.</div>';
        return;
    }
    
    // Default coordinates - Sta. Clara Norte, Pila, Laguna
    const defaultLat = 14.2353;
    const defaultLng = 121.3669;
    
    // Initialize map
    map = L.map('cases-map').setView([defaultLat, defaultLng], 10);
    
    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);
    
    // Initialize marker cluster group
    markerClusterGroup = L.markerClusterGroup({
        maxClusterRadius: 80,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
    });
    
    // Initialize individual layer group
    individualLayerGroup = L.layerGroup();
    
    // Load cases data
    const cases = {{ cases_data|tojson|safe }};
    
    // Status color mapping
    const statusColors = {
        'OPEN': '#dc3545',
        'INVESTIGATING': '#fd7e14',
        'RESOLVED': '#28a745',
        'DISMISSED': '#6c757d'
    };
    
    function loadCasesData() {
        // Clear existing markers
        markers = [];
        markerClusterGroup.clearLayers();
        individualLayerGroup.clearLayers();
        
        // Create markers for cases with coordinates
        const bounds = L.latLngBounds();
        let hasValidCases = false;
        
        cases.forEach(caseData => {
            if (caseData.incident_latitude && caseData.incident_longitude) {
                hasValidCases = true;
                const position = [parseFloat(caseData.incident_latitude), parseFloat(caseData.incident_longitude)];
                
                // Create circle marker with status color
                const marker = L.circleMarker(position, {
                    radius: 8,
                    fillColor: statusColors[caseData.status] || '#888888',
                    fillOpacity: 1,
                    color: '#ffffff',
                    weight: 2
                });
                
                // Create popup content
                const popupContent = `
                    <div class="case-popup" style="max-width: 300px;">
                        <h6 class="mb-2"><strong>${escapeHtml(caseData.case_number)}</strong></h6>
                        <div class="mb-2">
                            <span class="badge bg-${getStatusBadgeColor(caseData.status)}">${escapeHtml(caseData.status)}</span>
                            <span class="badge bg-secondary ms-1">${escapeHtml(caseData.category)}</span>
                        </div>
                        <div class="mb-2">
                            <strong>Date:</strong> ${new Date(caseData.incident_date).toLocaleDateString()}
                        </div>
                        <div class="mb-2">
                            <strong>Location:</strong> ${escapeHtml(caseData.incident_location || 'Not specified')}
                        </div>
                        <div class="mb-2">
                            <strong>Complainant:</strong> ${escapeHtml(caseData.complainant ? caseData.complainant.full_name : 'Anonymous')}
                        </div>
                        <div class="mb-2">
                            <strong>Respondent:</strong> ${escapeHtml(caseData.respondent_name || 'Unknown')}
                        </div>
                        <div class="mb-2">
                            <strong>Description:</strong><br>
                            <small>${escapeHtml((caseData.narrative || 'No description').substring(0, 150))}${caseData.narrative && caseData.narrative.length > 150 ? '...' : ''}</small>
                        </div>
                        <div class="text-center mt-2">
                            <a href="/admin/blotter/${caseData.id}" class="btn btn-sm btn-primary" target="_blank">
                                View Details
                            </a>
                        </div>
                    </div>
                `;
                
                // Bind popup
                marker.bindPopup(popupContent);
                
                markers.push(marker);
                bounds.extend(position);
            }
        });
        
        // Add markers to appropriate layer
        if (clusteringEnabled) {
            markers.forEach(marker => markerClusterGroup.addLayer(marker));
            map.addLayer(markerClusterGroup);
            if (map.hasLayer(individualLayerGroup)) {
                map.removeLayer(individualLayerGroup);
            }
        } else {
            markers.forEach(marker => individualLayerGroup.addLayer(marker));
            map.addLayer(individualLayerGroup);
            if (map.hasLayer(markerClusterGroup)) {
                map.removeLayer(markerClusterGroup);
            }
        }
        
        // Fit map to show all cases if any exist
        if (hasValidCases && bounds.isValid()) {
            map.fitBounds(bounds, { padding: [50, 50] });
            // Don't zoom in too much
            if (map.getZoom() > 15) {
                map.setZoom(15);
            }
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }
    
    function getStatusBadgeColor(status) {
        switch(status) {
            case 'OPEN': return 'danger';
            case 'INVESTIGATING': return 'warning';
            case 'RESOLVED': return 'success';
            case 'DISMISSED': return 'secondary';
            default: return 'secondary';
        }
    }
    
    // Load data
    loadCasesData();
    
    // Toggle clustering
    document.getElementById('cluster-toggle').addEventListener('click', function() {
        clusteringEnabled = !clusteringEnabled;
        this.innerHTML = clusteringEnabled 
            ? '<i class="fas fa-layer-group"></i> Disable Clustering'
            : '<i class="fas fa-layer-group"></i> Enable Clustering';
        loadCasesData();
    });
    
    // Refresh map
    document.getElementById('refresh-map').addEventListener('click', function() {
        location.reload();
    });
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('cases-map')) {
        initOpenStreetMapCases();
    }
});
</script>

<style>
.google-maps-cases-container,
.osm-cases-container {
    margin-bottom: 1rem;
}

.cases-map {
    height: 500px;
    width: 100%;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
}

.map-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.map-controls .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
}

.map-legend {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 0.5rem;
    background: #f8f9fa;
    border-radius: 0.375rem;
    border: 1px solid #dee2e6;
}

.legend-title {
    font-weight: 600;
    color: #495057;
}

.legend-items {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.875rem;
}

.marker-sample {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #ffffff;
}

.marker-sample.open {
    background-color: #dc3545;
}

.marker-sample.investigating {
    background-color: #fd7e14;
}

.marker-sample.resolved {
    background-color: #28a745;
}

.marker-sample.dismissed {
    background-color: #6c757d;
}

.case-popup {
    max-width: 300px;
}

.case-popup .badge {
    font-size: 0.75em;
}

.case-popup h6 {
    color: #495057;
    border-bottom: 1px solid #dee2e6;
    padding-bottom: 0.5rem;
}

@media (max-width: 576px) {
    .cases-map {
        height: 400px;
    }
    
    .map-controls {
        flex-direction: column;
    }
    
    .map-controls .btn {
        justify-content: center;
    }
    
    .legend-items {
        flex-direction: column;
        gap: 0.5rem;
    }
}
</style>
